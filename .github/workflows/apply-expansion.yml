name: apply-portfolio-expansion
on:
  push:
    branches: [agent/portfolio-expansion-v2]
permissions:
  contents: write
jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize expanded source tree
        run: |
          python - <<'PYCODE'
          import base64
          import io
          import lzma
          import shutil
          import tarfile
          from pathlib import Path

          root = Path('.')
          encoded = ''.join(path.read_text().strip() for path in sorted((root / '.portfolio-expansion').glob('part-*.txt')))
          payload = lzma.decompress(base64.b64decode(encoded))
          for child in root.iterdir():
              if child.name == '.git':
                  continue
              if child.is_dir():
                  shutil.rmtree(child)
              else:
                  child.unlink()
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:') as archive:
              archive.extractall(root)
          PYCODE
      - name: Commit expanded project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand CampusFlow into a full planning platform"
          git push origin HEAD:agent/portfolio-expansion-v2
